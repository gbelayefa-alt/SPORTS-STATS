
<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
  <pre id="output">Loading...</pre>
  <script>
    fetch("https://v3.football.api-sports.io/players?search=messi&league=61&season=2022", {
      method: "GET",
      headers: {
        "x-apisports-key": "8ac66be1a5262bc5c515ffda84a93b78"
      }
    })
    .then(r => r.json())
    .then(data => {
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    })
    .catch(err => {
      document.getElementById("output").textContent = "Error: " + err;
    });
  </script>
</body>
</html>
